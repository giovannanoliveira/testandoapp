# Blueprint do Render: cria o banco Postgres e o serviço web (API + app web).
# Render → New → Blueprint → escolha este repositório. Ele vai pedir as chaves marcadas com sync: false.
databases:
  - name: vizinhanca-db
    plan: free
    databaseName: vizinhanca
    user: vizinhanca

services:
  - type: web
    name: vizinhanca-real
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:web && pnpm db:push && pnpm seed:stripe
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vizinhanca-db
          property: connectionString
      # Clerk (dashboard.clerk.com → API Keys). A chave pública pode ficar no código;
      # a secreta (sk_...) é colada só no painel do Render.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_aW50ZWdyYWwtZ3JpZmZvbi0zMjYxLmNsZXJrLmFjY291bnRzLmRldiQ
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: pk_test_aW50ZWdyYWwtZ3JpZmZvbi0zMjYxLmNsZXJrLmFjY291bnRzLmRldiQ
      # Stripe (dashboard.stripe.com → Developers → API keys / Webhooks)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Opcional
      - key: OPENAI_API_KEY
        sync: false
