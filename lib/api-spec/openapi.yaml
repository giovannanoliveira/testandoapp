openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: imoveis
    description: Property operations
  - name: avaliacoes
    description: Review operations
  - name: comparacoes
    description: Property comparison operations
  - name: assistente
    description: AI assistant operations
  - name: stripe
    description: Premium payment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and invalidate the session
      responses:
        "204":
          description: Logged out
  /imoveis:
    get:
      operationId: listImoveis
      tags: [imoveis]
      summary: List properties with their reviews
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Imovel"
  /imoveis/{id}:
    get:
      operationId: getImovel
      tags: [imoveis]
      summary: Get a property with its reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Imovel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /avaliacoes:
    get:
      operationId: listAvaliacoes
      tags: [avaliacoes]
      summary: List reviews, optionally filtered by property
      parameters:
        - name: imovelId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Avaliacao"
    post:
      operationId: createAvaliacao
      tags: [avaliacoes]
      summary: Create a review (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvaliacaoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaliacao"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /comparacoes:
    post:
      operationId: compareImoveis
      tags: [comparacoes]
      summary: Compare selected properties using reviews and AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparacaoInput"
      responses:
        "200":
          description: Comparative overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparacaoResponse"
        "400":
          description: Invalid property selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "404":
          description: One or more properties were not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /assistente/chat:
    post:
      operationId: chatComAssistente
      tags: [assistente]
      summary: Ask the Vizinhança Real assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistenteChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistenteChatResponse"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /stripe/checkout:
    post:
      operationId: createPremiumCheckout
      tags: [stripe]
      summary: Create an authenticated Stripe Checkout for the Premium plan
      responses:
        "200":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumCheckoutResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
        "502":
          description: Stripe unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
  /stripe/status:
    get:
      operationId: getPremiumStatus
      tags: [stripe]
      summary: Get the authenticated user's latest Premium payment status
      responses:
        "200":
          description: Premium payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumStatusResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Usuario:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
      required: [id, name, email]
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 6
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
      required: [email, password]
    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/Usuario"
      required: [token, user]
    NotaCategoria:
      type: object
      properties:
        nota:
          type: number
          minimum: 1
          maximum: 5
        comentario:
          type: string
      required: [nota]
    AvaliacaoNotas:
      type: object
      properties:
        apartamento:
          $ref: "#/components/schemas/NotaCategoria"
        condominio:
          $ref: "#/components/schemas/NotaCategoria"
        proprietario:
          $ref: "#/components/schemas/NotaCategoria"
        imobiliaria:
          $ref: "#/components/schemas/NotaCategoria"
    Avaliacao:
      type: object
      properties:
        id:
          type: number
        imovelId:
          type: number
        userId:
          type: number
        userName:
          type: string
        data:
          type: string
          format: date-time
        notas:
          $ref: "#/components/schemas/AvaliacaoNotas"
        oQueGostariaDeSaber:
          type: string
      required: [id, imovelId, userId, userName, data, notas, oQueGostariaDeSaber]
    AvaliacaoInput:
      type: object
      properties:
        imovelId:
          type: number
        notas:
          $ref: "#/components/schemas/AvaliacaoNotas"
        oQueGostariaDeSaber:
          type: string
          minLength: 20
      required: [imovelId, notas, oQueGostariaDeSaber]
    ComparacaoInput:
      type: object
      properties:
        imovelIds:
          type: array
          minItems: 2
          maxItems: 4
          uniqueItems: true
          items:
            type: number
      required: [imovelIds]
    ComparacaoImovel:
      type: object
      properties:
        id:
          type: number
        nome:
          type: string
        endereco:
          type: string
        mediaGeral:
          type: number
        totalAvaliacoes:
          type: number
        pontosPositivos:
          type: array
          items:
            type: string
        pontosNegativos:
          type: array
          items:
            type: string
      required:
        [id, nome, endereco, mediaGeral, totalAvaliacoes, pontosPositivos, pontosNegativos]
    ComparacaoResponse:
      type: object
      properties:
        imoveis:
          type: array
          items:
            $ref: "#/components/schemas/ComparacaoImovel"
        visaoGeral:
          type: string
        recomendacao:
          type: string
        geradoPorIa:
          type: boolean
      required: [imoveis, visaoGeral, recomendacao, geradoPorIa]
    AssistenteMensagem:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required: [role, content]
    AssistenteChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AssistenteMensagem"
      required: [messages]
    AssistenteChatResponse:
      type: object
      properties:
        resposta:
          type: string
        geradoPorIa:
          type: boolean
      required: [resposta, geradoPorIa]
    PremiumCheckoutResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]
    PremiumStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [none, open, complete, expired]
        paymentStatus:
          type: string
          enum: [unpaid, paid, no_payment_required]
        isPremium:
          type: boolean
      required: [status, paymentStatus, isPremium]
    Imovel:
      type: object
      properties:
        id:
          type: number
        nome:
          type: string
        endereco:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        avaliacoes:
          type: array
          items:
            $ref: "#/components/schemas/Avaliacao"
      required: [id, nome, endereco, bairro, cidade, avaliacoes]
