kind = "mobile"
previewPath = "/"
title = "Vizinhança Real"
description = "App mobile para avaliação de imóveis de aluguel. Permite que ex-moradores avaliem apartamentos, condomínios, proprietários e imobiliárias nas 4 categorias, ajudando futuros inquilinos a descobrir como é realmente morar em um lugar antes de assinar o contrato."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
